<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popup · Convention Annuelle des Femmes 2026</title>
<style>
/* Page de démo */
body {
  margin: 0;
  font-family: sans-serif;
  background: #f0ede8;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  color: #555;
  text-align: center;
  padding: 2rem;
}
.demo-label { font-size: 1.05rem; line-height: 1.8; }
.demo-label strong { color: #1E3A5F; }

/* ════════════════════════════════════════════════════════
   POPUP · styles à copier dans vos pages
════════════════════════════════════════════════════════ */
#eipv-popup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.72);
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.45s ease, visibility 0.45s ease;
}
#eipv-popup-overlay.eipv-open {
  opacity: 1;
  visibility: visible;
}
#eipv-popup-box {
  position: relative;
  width: 100%;
  max-width: 460px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 8px 28px rgba(0,0,0,0.35);
  background: #000;
  transform: scale(0.85) translateY(24px);
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#eipv-popup-overlay.eipv-open #eipv-popup-box {
  transform: scale(1) translateY(0);
}
#eipv-popup-img {
  display: block;
  width: 100%;
  height: auto;
  cursor: pointer;
  border-radius: 18px;
  transition: opacity 0.2s;
}
#eipv-popup-img:hover { opacity: 0.92; }

#eipv-popup-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(0,0,0,0.65);
  border: 2px solid rgba(255,255,255,0.65);
  color: #fff;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, transform 0.2s;
  z-index: 100001;
  font-family: Arial, sans-serif;
  padding: 0;
}
#eipv-popup-close:hover {
  background: rgba(255,255,255,0.22);
  transform: scale(1.12) rotate(90deg);
}
#eipv-popup-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 4px;
  width: 100%;
  background: linear-gradient(90deg, #C9A84C, #f5d98a, #C9A84C);
  transform-origin: left center;
  transform: scaleX(1);
}
#eipv-popup-bar.eipv-running {
  transition: transform var(--eipv-dur, 10s) linear;
  transform: scaleX(0);
}
@media (max-width: 500px) {
  #eipv-popup-box { max-width: calc(100vw - 2rem); border-radius: 14px; }
  #eipv-popup-img { border-radius: 14px; }
}
</style>
</head>
<body>

<p class="demo-label">
  <strong>Page de démonstration</strong><br>
  Le popup Convention Annuelle des Femmes s'affiche après 3 secondes.
</p>

<!-- ════ POPUP HTML · copier ce bloc et le script jusqu'à </body> ════ -->
<div id="eipv-popup-overlay"
     role="dialog"
     aria-modal="true"
     aria-label="Convention Annuelle des Femmes 2026">
  <div id="eipv-popup-box">
    <button id="eipv-popup-close" aria-label="Fermer">&#215;</button>
    <img id="eipv-popup-img"
         src=""
         alt="Convention Annuelle des Femmes 2026 · La Puissance de la Langue">
    <div id="eipv-popup-bar"></div>
  </div>
</div>

<script>
(function () {

  /* ══ CONFIGURATION · modifier uniquement ces 2 variables ═══════ */
  var POPUP_IMAGE_URL  = "images/annuel_femme.jpg";
  var POPUP_TARGET_URL = "/convention-annuelle-femmes-2026";
  /* ════════════════════════════════════════════════════════════════ */

  var DELAY_OPEN    = 3000;   /* délai avant 1re apparition (ms)    */
  var AUTO_CLOSE_MS = 3000;   /* fermeture automatique       (ms)   */
  var REPEAT_MS     = 300000; /* réaffichage toutes les 5 min (ms)  */

  var overlay    = document.getElementById("eipv-popup-overlay");
  var img        = document.getElementById("eipv-popup-img");
  var closeBtn   = document.getElementById("eipv-popup-close");
  var bar        = document.getElementById("eipv-popup-bar");
  var autoTimer  = null;
  var repeatTimer = null;
  var isOpen     = false;

  img.src = POPUP_IMAGE_URL;

  function openPopup() {
    if (isOpen) return;
    isOpen = true;
    bar.classList.remove("eipv-running");
    bar.style.setProperty("--eipv-dur", (AUTO_CLOSE_MS / 1000) + "s");
    bar.offsetWidth; /* reflow pour relancer l'animation */
    overlay.classList.add("eipv-open");
    requestAnimationFrame(function () { bar.classList.add("eipv-running"); });
    autoTimer = setTimeout(closePopup, AUTO_CLOSE_MS);
  }

  function closePopup() {
    if (!isOpen) return;
    isOpen = false;
    clearTimeout(autoTimer);
    clearTimeout(repeatTimer);
    overlay.classList.remove("eipv-open");
    bar.classList.remove("eipv-running");
    repeatTimer = setTimeout(openPopup, REPEAT_MS);
  }

  /* Démarrage */
  setTimeout(openPopup, DELAY_OPEN);

  /* Fermeture bouton X */
  closeBtn.addEventListener("click", closePopup);

  /* Fermeture clic fond */
  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) closePopup();
  });

  /* Fermeture touche Échap */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && isOpen) closePopup();
  });

  /* Clic image → fermer le popup */
  img.addEventListener("click", closePopup);

  /* Pause quand l'onglet passe en arrière-plan */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      clearTimeout(autoTimer);
      clearTimeout(repeatTimer);
    }
  });

})();
</script>

</body>
</html>
